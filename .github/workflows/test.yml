name: Local sports reposter tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: python3 -m py_compile scripts/local-sportswire.py scripts/sportswire_local/*.py
      - run: python3 -m unittest discover -s scripts -p 'test_local_sportswire*.py' -v
