name: SportsWire247 local repost verification

on:
  push:
    branches: [main, sportswire/newsroom-v2]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: sportswire247-local-reposter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: python3 -m py_compile scripts/local-sportswire.py scripts/sportswire_local/*.py
      - run: python3 -m unittest discover -s scripts -p 'test_local_sportswire*.py' -v
      - run: cp config.example.json config.json
      - run: python3 scripts/local-sportswire.py --health
