name: SportsWire scheduled carousel

on:
  workflow_dispatch:
  schedule:
    # 2:00 PM and 5:00 PM Pacific (PDT; update UTC offsets at DST transition).
    - cron: "0 21,0 * * *"

permissions:
  contents: write

concurrency:
  group: sportswire-carousel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 1, ref: main }
      - uses: actions/setup-node@v6
        with: { node-version: "24" }
      - name: Publish verified six-slide carousel
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/publish-sportswire-carousel.mjs
      - name: Save carousel publication receipt
        if: success()
        run: |
          git config user.name "SportsWire 247"
          git config user.email "actions@users.noreply.github.com"
          git add carousel/publication.json
          git diff --cached --quiet || git commit -m "Record SportsWire carousel publication"
          git push origin HEAD:main
